<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Certificaciones - UEF La Dolorosa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- INTERFAZ ADMINISTRATIVA (BARRA LATERAL) -->
    <div class="interface-container">
        <header class="sidebar-header">
            <h2>UEF La Dolorosa</h2>
            <p>Generador de Certificados</p>
        </header>
        
        <main class="sidebar-content">
            <!-- 1. Campo Docente ÚNICO Blindado -->
            <div class="form-group">
                <label for="docente-select">Seleccione el Docente:</label>
                <select id="docente-select">
                    <option value="">-- Seleccione un docente --</option>
                </select>
            </div>

            <!-- 2. Campo Artículo ÚNICO -->
            <div class="form-group">
                <label for="articulo-select">Artículo del Docente:</label>
                <select id="articulo-select">
                    <option value="El">El (Masculino)</option>
                    <option value="La">La (Femenino)</option>
                </select>
            </div>

            <!-- 3. Campo Ajustar Título ÚNICO -->
            <div class="form-group">
                <label for="titulo-override">Ajustar Título (Opcional):</label>
                <select id="titulo-override">
                    <option value="AUTO">Usar título por defecto</option>
                    <option value="Licenciado">Licenciado</option>
                    <option value="Licenciada">Licenciada</option>
                    <option value="Ingeniero">Ingeniero</option>
                    <option value="Ingeniera">Ingeniera</option>
                    <option value="Magíster">Magíster</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Doctora">Doctora</option>
                    <option value="Abogado">Abogado</option>
                    <option value="Abogada">Abogada</option>
                </select>
            </div>

            <button id="btn-print" class="btn-primary" disabled>🖨️ Imprimir Certificado</button>
        </main>
        
        <footer class="sidebar-footer">
            <p>Comisión de Planeamiento © 2026</p>
        </footer>
    </div>

    <!-- CONTENEDOR VISTA PREVIA (HOJA A4) -->
    <div class="document-preview">
        <div id="certificado-a4" class="certificado-page">
            <div class="placeholder-text">
                <p>Por favor, seleccione un docente del listado de la barra lateral izquierda para procesar las horas pedagógicas y generar la vista previa del certificado legal A4.</p>
            </div>
        </div>
    </div>

    <!-- VINCULACIÓN DE ARCHIVOS LÓGICOS DE NAVEGACIÓN -->
    <script src="docentes.js"></script>
    <script src="horarios.js"></script>
    <script src="app.js"></script>
</body>
</html>
